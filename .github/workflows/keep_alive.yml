name: Keep Supabase Database Active & Daily Heartbeat Alert

on:
  schedule:
    # Runs twice every day (at 00:00 UTC and 12:00 UTC) to keep Supabase active
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI anytime

jobs:
  ping-supabase:
    name: Supabase Healthcheck & Heartbeat Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Database Heartbeat
        run: |
          SUPABASE_URL="https://fyqplpczwucfsifzesqp.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5cXBscGN6d3VjZnNpZnplc3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzg1NDQsImV4cCI6MjEwMDkxNDU0NH0.EhEHY9KKQFmKoRg5s2nnsbsNnFUEoypdPw3CIU8Nqs0"
          
          echo "========================================="
          echo " Starting Supabase Daily Keep-Alive Ping "
          echo "========================================="
          echo "Target Supabase URL: ${SUPABASE_URL}"
          
          # 1. Ping tickets table
          echo "Checking 'tickets' table..."
          HTTP_STATUS_TICKETS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/tickets?select=id&limit=1")
          echo "Tickets HTTP Status: ${HTTP_STATUS_TICKETS}"

          # 2. Ping agents table
          echo "Checking 'agents' table..."
          HTTP_STATUS_AGENTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/agents?select=id&limit=1")
          echo "Agents HTTP Status: ${HTTP_STATUS_AGENTS}"

          # 3. Ping ticket_activities table
          echo "Checking 'ticket_activities' table..."
          HTTP_STATUS_ACT=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/ticket_activities?select=id&limit=1")
          echo "Activities HTTP Status: ${HTTP_STATUS_ACT}"

          echo "========================================="
          if [ "$HTTP_STATUS_TICKETS" -eq 200 ] || [ "$HTTP_STATUS_AGENTS" -eq 200 ] || [ "$HTTP_STATUS_ACT" -eq 200 ]; then
            echo "✅ SUCCESS: Supabase database is active, healthy, and queried successfully."
          else
            echo "❌ ALERT: Supabase database ping failed (Tickets: ${HTTP_STATUS_TICKETS}, Agents: ${HTTP_STATUS_AGENTS}, Activities: ${HTTP_STATUS_ACT})."
            echo "Project may be paused or unreachable. Please check https://supabase.com/dashboard/project/fyqplpczwucfsifzesqp"
            exit 1
          fi
